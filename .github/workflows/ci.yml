name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  pose-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/pose-sidecar-requirements.txt
      - run: python -m py_compile scripts/mediapipe_pose_extractor.py
      - run: |
          python scripts/mediapipe_pose_extractor.py \
            --download-model-only \
            --model /tmp/pose_landmarker_full.task
          python scripts/mediapipe_pose_extractor.py \
            --check \
            --model /tmp/pose_landmarker_full.task

  docker-pose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tiktokmoney-pose-ci .
      - run: |
          docker run -d --rm \
            --name tiktokmoney-pose-ci \
            -p 3000:3000 \
            -e VIDEO_PIPELINE_MODE=audiovisual \
            tiktokmoney-pose-ci
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"extractorKind": "bundled-mediapipe"' /tmp/health.json
          grep -q '"bundled": true' /tmp/health.json
          docker stop tiktokmoney-pose-ci
